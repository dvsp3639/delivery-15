<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f2f2f2;
    }

    .wrapper {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      border-radius: 16px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
      color: orange;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      font-size: 34px;
    }

    .status-icon {
      width: 110px;
      height: 110px;
      background: #e8f9ee;
      border-radius: 50%;
      margin: 30px auto 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      color: green;
    }

    h2 {
      margin: 10px 0;
      color: green;
      font-size: 28px;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    .details {
      margin-top: 25px;
      background: #fafafa;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      font-size: 15px;
      color: #444;
    }

    .details strong {
      color: black;
    }

    .btn {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: orange;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: darkorange;
    }

    .small-link {
      display: block;
      margin-top: 18px;
      color: gray;
      font-size: 14px;
      text-decoration: none;
    }

    .small-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <div class="brand">
      <span></span> Orange Restaurant
    </div>

    <div class="status-icon">✔</div>

    <h2>Payment Successful</h2>

    <p>
      Your order has been placed successfully 🎉 <br />
      Our kitchen has started preparing your delicious meal.
    </p>

    <div class="details">
      <p><strong>Order Status:</strong> Confirmed</p>
      <p><strong>Estimated Delivery:</strong> 25 - 30 mins</p>
      <p><strong>Payment Method:</strong> Online Payment</p>
    </div>



  </div>
</body>
</html>
