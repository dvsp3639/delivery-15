  async function startPayment(total) {

        if (!customerMobile || !customerName) {
            alert("Please Order through whataspp :, you will get link there");
            window.location.href = "../";
            }
    
    const response = await fetch(
      "https://asia-south1-test-nov-3.cloudfunctions.net/createPhonePePayment",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ totalAmount: total }),
      }
    );

    const result = await response.json();

    const merchantOrderId = result.merchantOrderId;
    const token = result.tokenData.access_token;
    const redirectUrl = result.paymentData.redirectUrl;

    window.PhonePeCheckout.transact({
      tokenUrl: redirectUrl,
      type: "IFRAME",

      callback: function (paymentResult) {
        console.log("Payment Finished:", paymentResult);
        if (paymentResult === "USER_CANCEL") {
            window.PhonePeCheckout.closePage();
            return;

        } else if (paymentResult === "CONCLUDED") {
                   // ✅ Verify payment officially
                    verifyPayment(merchantOrderId, token);
                    return;

        } 
 

      },
    });
  }

    <!-- Firebase Configuration and Initialization -->
    <script>

        
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDrCUl3vY2ZeQ1UrbQREnvTUImNVabYcg4",
            authDomain: "orange-delivery-db.firebaseapp.com",
            projectId: "orange-delivery-db",
            storageBucket: "orange-delivery-db.firebasestorage.app",
            messagingSenderId: "185759993186",
            appId: "1:185759993186:web:69677777698186e05d303b"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Collections
        const MENU_ITEMS_COLLECTION = "menuItems";
        const ORDERS_COLLECTION = "restaurantOrders";
        const DAILY_SALES_COLLECTION = "dailySales";
        const LAST_ORDER_INFO_DOC = "lastOrderInfo";
        const CATEGORIES_DOC = "categories";

        // DOM elements
        const cartItemsList = document.getElementById('cartItemsList');
        const checkoutSubtotal = document.getElementById('checkoutSubtotal');
        const checkoutDiscount = document.getElementById('checkoutDiscount');
        const checkoutTotal = document.getElementById('checkoutTotal');
        const placeOrderBtn = document.getElementById('placeOrderBtn');
        const backToMenu = document.getElementById('backToMenu');

        // Cart data
        let cart = [];
        let cartData = { items: [], subtotal: 0, discount: 0, total: 0 };


        // Load cart data from sessionStorage
        function loadCartData() {
            const storedCartData = sessionStorage.getItem('cartData');
            if (storedCartData) {
                cartData = JSON.parse(storedCartData);
                cart = cartData.items || [];
                updateCheckoutPage();
            } else {
                // If no cart data, redirect back to menu
                window.location.href = '../index.html';
            }
        }

        // Update checkout page
        function updateCheckoutPage() {
            if (!cartItemsList) return;
            
            cartItemsList.innerHTML = '';
            
            if (cart.length === 0) {
                cartItemsList.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>Your cart is empty</h3>
                        <p>Add some delicious items to your cart</p>
                    </div>
                `;

                // Reset all totals to zero
                if (checkoutSubtotal) checkoutSubtotal.textContent = `₹ 0.00`;
                const checkoutGST = document.getElementById('checkoutGST');
                if (checkoutGST) checkoutGST.textContent = `₹ 0.00`;
                if (checkoutDiscount) checkoutDiscount.textContent = `- ₹ 0.00`;
                if (checkoutTotal) checkoutTotal.textContent = `₹ 0.00`;

                return;
            }
            
            let subtotal = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                const cartItemElement = document.createElement('div');
                cartItemElement.className = 'cart-item';
                cartItemElement.innerHTML = `
                    <div class="cart-item-header">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">₹ ${item.price.toFixed(2)}</div>
                    </div>
                    <div class="cart-item-details">
                        <div class="cart-item-total">₹ ${itemTotal.toFixed(2)}</div>
                        <div class="cart-item-controls">
                            
                            <span class="quantity">Quantity: ${item.quantity}</span>
                            <button class="delete-item" onclick="removeItem('${item.name}')">
                                <i class="fas fa-trash"></i>
                            </button>
    
                        </div>
                    </div>
                `;
                
                cartItemsList.appendChild(cartItemElement);
            });
            
            // Update checkout summary
            
            const gst = subtotal * 0.05;
            const subtotalWithGST = subtotal + gst;
            const discount = subtotalWithGST * 0.10;
            const total = subtotalWithGST - discount;
    
            
            if (checkoutSubtotal) checkoutSubtotal.textContent = `₹ ${subtotal.toFixed(2)}`;
            
            const checkoutGST = document.getElementById('checkoutGST');
            if (checkoutGST) checkoutGST.textContent = `₹ ${gst.toFixed(2)}`;
            if (checkoutDiscount) checkoutDiscount.textContent = `- ₹ ${discount.toFixed(2)}`;
    
            if (checkoutTotal) checkoutTotal.textContent = `₹ ${total.toFixed(2)}`;
        }

        
        function removeItem(itemName) {
            cart = cart.filter(item => item.name !== itemName);
            sessionStorage.setItem('cartData', JSON.stringify({ items: cart }));
            updateCheckoutPage();
        }

        // Save order to Firebase
    
        async function saveOrderToStorage() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return false;
            }
            
            // Calculate order totals
            let subtotal = 0;
            cart.forEach(item => {
                subtotal += item.price * item.quantity;
            });
            
            const gst = subtotal * 0.05;
            const subtotalWithGST = subtotal + gst;
            const discount = subtotalWithGST * 0.10;
            const total = subtotalWithGST - discount;
    
            
            try {
                // Get last order info from Firebase
                const lastOrderDoc = await db.collection("config").doc(LAST_ORDER_INFO_DOC).get();
                let lastOrderInfo = { kot: 50, bill: 50 };
                if (lastOrderDoc.exists) {
                    lastOrderInfo = lastOrderDoc.data();
                }
                
                const newKOT = lastOrderInfo.kot + 1;
                const newBILL = lastOrderInfo.bill + 1;
                
                // Create order object
                const order = {
                    orderId: 'ORD' + Date.now(),
                    orderNumber: newBILL,
                    kotNumber: newKOT,
                    customerName: customerName,
                    customerMobile: customerMobile,
                    customerLocation: customerLocation,
                    createdAt: new Date().toLocaleString('en-IN', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }),
                    timestamp: new Date().getTime(),
                    date: new Date().toISOString().split('T')[0],
                    items: [...cart],
                    subtotal: subtotal.toFixed(2),
                    discount: discount.toFixed(2),
                    total: total.toFixed(2),
                    status: 'pending',
                    restaurantName: 'Orange Restaurant'
                };
                
                
        function removeItem(itemName) {
            cart = cart.filter(item => item.name !== itemName);
            sessionStorage.setItem('cartData', JSON.stringify({ items: cart }));
            updateCheckoutPage();
        }

        // Save order to Firebase
    
                await db.collection(ORDERS_COLLECTION).add(order);
                
                // Update last order info in Firebase
                await db.collection("config").doc(LAST_ORDER_INFO_DOC).set({
                    kot: newKOT,
                    bill: newBILL
                });
                
                // Update daily sales in Firebase
                await updateDailySalesInFirebase(total);
                
                // alert(`Order placed successfully!\nKOT: ${newKOT} | BILL: ${newBILL}`);
                
                // Clear cart data from sessionStorage
                sessionStorage.removeItem('cartData');
                
                // Redirect back to menu
                return true;
                
            } catch (error) {
                console.error("Error saving order to Firebase:", error);
                alert('Error placing order. Please try again.');
                return false;
            }
        }
        
        // Update daily sales in Firebase
        async function updateDailySalesInFirebase(orderTotal) {
            const today = new Date().toISOString().split('T')[0];
            
            try {
                // Get today's sales document
                const salesDocRef = db.collection(DAILY_SALES_COLLECTION).doc(today);
                const salesDoc = await salesDocRef.get();
                
                if (salesDoc.exists) {
                    const salesData = salesDoc.data();
                    await salesDocRef.update({
                        total: firebase.firestore.FieldValue.increment(parseFloat(orderTotal)),
                        orderCount: firebase.firestore.FieldValue.increment(1),
                        'dineIn.total': firebase.firestore.FieldValue.increment(parseFloat(orderTotal)),
                        'dineIn.count': firebase.firestore.FieldValue.increment(1)
                    });
                } else {
                    await salesDocRef.set({
                        date: today,
                        total: parseFloat(orderTotal),
                        orderCount: 1,
                        dineIn: { total: parseFloat(orderTotal), count: 1 },
                        delivery: { total: 0, count: 0 },
                        pickup: { total: 0, count: 0 }
                    });
                }
            } catch (error) {
                console.error("Error updating daily sales in Firebase:", error);
            }
        }

        // Event listeners
        if (backToMenu) {
            backToMenu.addEventListener('click', () => {
                window.location.href = '../index.html';
            });
        }
            placeOrderBtn.addEventListener("click", () => {

                if (cart.length === 0) {
                    alert("Your cart is empty!");
                    return;
                }

                // Calculate total after discount (same as order)
                let subtotal = 0;
                cart.forEach(item => {
                    subtotal += item.price * item.quantity;
                });

                
                const gst = subtotal * 0.05;
                const subtotalWithGST = subtotal + gst;
                const discount = subtotalWithGST * 0.10;
                const total = subtotalWithGST - discount;
    

                // ✅ Start payment first
                startPayment(total);
            });

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            loadCartData();
        });
    </script>
