<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f2f2f2;
    }

    .wrapper {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      border-radius: 16px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
      color: orange;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      font-size: 34px;
    }

    .status-icon {
      width: 110px;
      height: 110px;
      background: #ffecec;
      border-radius: 50%;
      margin: 30px auto 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      color: red;
    }

    h2 {
      margin: 10px 0;
      color: red;
      font-size: 28px;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    .details {
      margin-top: 25px;
      background: #fafafa;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      font-size: 15px;
      color: #444;
    }

    .details strong {
      color: black;
    }

    .btn {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: orange;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: darkorange;
    }

    .retry {
      margin-top: 18px;
      display: block;
      color: gray;
      font-size: 14px;
      text-decoration: none;
    }

    .retry:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <div class="brand">
      <span>🍊</span> Orange Restaurant
    </div>

    <div class="status-icon">✖</div>

    <h2>Payment Failed</h2>

    <p>
      Oops 😢 your payment could not be completed. <br />
      Please try again or choose another payment method.
    </p>

    <div class="details">
      <p><strong>Order Status:</strong> Not Confirmed</p>
      <p><strong>Reason:</strong> Transaction Declined</p>
      <p><strong>Next Step:</strong> Retry Payment</p>
    </div>

    <a href="../payment">
      <button class="btn">Try Payment Again</button>
    </a>

    <a class="retry" href="../../">
      Back to Menu
    </a>

  </div>
</body>
</html>
